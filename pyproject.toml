[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "colocon"
description = "Run colcon against repositories laid out as git worktrees."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Ricardo González", email = "ricardo@richiware.dev"}]
keywords = ["colcon", "ros", "ros2", "git-worktree", "build"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dynamic = ["version"]
dependencies = ["pyyaml>=5.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "pre-commit>=3"]

[project.urls]
Homepage = "https://github.com/richiware/colocon"
Source = "https://github.com/richiware/colocon"
Issues = "https://github.com/richiware/colocon/issues"

[project.scripts]
colocon = "colocon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "colocon.__version__"}

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["colocon"]
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
